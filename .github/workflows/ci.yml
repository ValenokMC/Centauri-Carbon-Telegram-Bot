name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the project claims to support, and the newest that
        # people are likely to have. Testing the claim is the point of the
        # bottom entry: dropping it would let 3.9 support rot silently.
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check that the package imports with no third-party modules
        # The release promises "standard library only". This is that promise,
        # tested: the environment holds nothing but pytest, so an accidental
        # `import requests` in src/ fails here rather than on a user's machine.
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import centauri_bot, centauri_bot.app, centauri_bot.setup_wizard; print(centauri_bot.__version__)"

      - name: Run tests
        run: python -m pytest tests/ -q

  syntax:
    name: Syntax and byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every module
        run: python -m compileall -q src tools tests

  safety:
    name: Public-safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan the repository for private data
        # Non-zero exit fails the build. This runs on every pull request,
        # including from forks, which is the case it exists for.
        run: python tools/check_public_safety.py

  release-archive:
    name: Build and inspect the release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python tools/build_release.py --version ci

      - name: Scan the archive itself
        # The repository being clean does not prove the archive is: the build
        # step chooses what goes in, and that choice is what ships.
        run: python tools/check_public_safety.py dist/*.zip

      - name: Check the archive contents
        run: python tools/build_release.py --verify dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: dist/*.zip
          retention-days: 7
