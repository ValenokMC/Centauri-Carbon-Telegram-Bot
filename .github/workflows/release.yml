name: Release

# Triggered by pushing a tag, so cutting a release is one command and cannot
# happen by accident from a branch push.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" | sed "s/=v/=/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Tests must pass before anything is published
        # The following safety scan deliberately rejects build caches. Keep
        # the release checkout pristine while still running the full suite.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider tests/ -q

      - name: The repository must be free of private data
        run: python tools/check_public_safety.py

      - name: Build the archive
        run: python tools/build_release.py --version "${{ steps.version.outputs.value }}"

      - name: The archive must also be free of private data
        # The repository being clean does not prove the archive is: the build
        # step chooses what goes in, and that choice is what ships.
        run: python tools/check_public_safety.py dist/*.zip

      - name: Check the archive contents
        run: python tools/build_release.py --verify dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          draft: true          # reviewed by a human before it goes out
          name: "v${{ steps.version.outputs.value }}"
          body_path: .github/release-notes-template.md
          files: |
            dist/Centauri-Bot-v${{ steps.version.outputs.value }}-windows.zip
            dist/SHA256SUMS.txt
